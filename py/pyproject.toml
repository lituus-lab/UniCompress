[build-system]
requires = ["setuptools>=64", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unicompress"
version = "0.1.0"
description = "Python binding for the UniCompress C library"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "lituus-lab" }]
keywords = ["nim", "compression", "deflate", "zlib"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lituus-lab/UniCompress"
Repository = "https://github.com/lituus-lab/UniCompress"
Issues = "https://github.com/lituus-lab/UniCompress/issues"

[project.optional-dependencies]
test = ["pytest>=9.1.1"]
# What py/notebooks/build_quickstart.py needs to regenerate and execute the
# notebook: `pip install unicompress[notebook]`.
notebook = ["nbformat", "nbclient", "ipykernel"]

[tool.setuptools]
packages = ["unicompress"]
